<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jacob NBA">
<title>Jacob's NBA</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root { --bg:#070a0f; --panel:#111823; --line:#1e2a3a; --text:#e8edf3; --muted:#8a97a8; --accent:#f97316; --blue:#2f81f7; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif; overflow:hidden; }
  #app { position:fixed; inset:0; padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }
  iframe { border:0; width:100%; height:100%; display:block; background:var(--bg); opacity:0; transition:opacity .35s ease; }
  iframe.ready { opacity:1; }

  /* Splash while the bot loads */
  #splash { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    background:radial-gradient(120% 80% at 50% 0%, #15202e 0%, var(--bg) 60%); transition:opacity .35s ease; z-index:2; }
  #splash.hide { opacity:0; pointer-events:none; }
  #splash img { width:96px; height:96px; border-radius:22px; box-shadow:0 10px 40px rgba(249,115,22,.25); }
  #splash h1 { margin:0; font-size:22px; font-weight:700; letter-spacing:.2px; }
  #splash p { margin:0; font-size:13px; color:var(--muted); }
  .bar { width:140px; height:3px; border-radius:3px; background:var(--line); overflow:hidden; }
  .bar i { display:block; width:40%; height:100%; background:var(--accent); border-radius:3px; animation:slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform:translateX(-100%); } 100% { transform:translateX(250%); } }

  /* Only shown if the bot doesn't load */
  #fail { position:fixed; left:16px; right:16px; bottom:calc(20px + env(safe-area-inset-bottom)); display:none; z-index:3;
    background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; text-align:center; }
  #fail p { margin:0 0 12px; font-size:14px; color:var(--muted); }
  #fail a, #fail button { display:block; width:100%; padding:14px; border-radius:12px; border:0; margin-top:8px;
    font-weight:600; font-size:16px; font-family:inherit; text-decoration:none; color:#fff; background:var(--blue); }
  #fail button { background:transparent; border:1px solid var(--line); color:var(--text); }
</style>
</head>
<body>
<div id="splash">
  <img src="icon-192.png" alt="">
  <h1>Jacob's NBA</h1>
  <div class="bar"><i></i></div>
  <p id="status">Loading today's picks…</p>
</div>

<div id="app">
  <iframe id="f" title="Jacob's NBA" allow="clipboard-write"
    src="https://script.google.com/macros/s/AKfycbwrJirIkyDktOdmFZMIsgOPT9BxNbMIBYiCUaIVRQNq_Jp1lJvZrYBNKsDKuYzNTl8qeQ/exec"></iframe>
</div>

<div id="fail">
  <p id="failmsg">The bot is taking longer than usual.</p>
  <a id="open" href="https://script.google.com/macros/s/AKfycbwrJirIkyDktOdmFZMIsgOPT9BxNbMIBYiCUaIVRQNq_Jp1lJvZrYBNKsDKuYzNTl8qeQ/exec">Open Jacob's NBA</a>
  <button type="button" onclick="location.reload()">Try again</button>
</div>

<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js?v=2');
  var f = document.getElementById('f'), splash = document.getElementById('splash'), fail = document.getElementById('fail');
  var loaded = false;
  f.addEventListener('load', function () {
    loaded = true;
    f.classList.add('ready');
    splash.classList.add('hide');
    fail.style.display = 'none';
  });
  // Only offer the fallback button if the bot really hasn't loaded.
  setTimeout(function () {
    if (!loaded) {
      document.getElementById('status').textContent = 'Still loading…';
      fail.style.display = 'block';
    }
  }, 10000);
  window.addEventListener('offline', function () {
    document.getElementById('failmsg').textContent = "You're offline. Connect to load the bot.";
    fail.style.display = 'block';
  });
</script>
</body>
</html>
